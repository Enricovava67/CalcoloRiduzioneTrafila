name: Compila APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Compila l'APK
        run: gradle assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CalcoloRiduzioneTrafila.apk

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: CalcoloRiduzioneTrafila-APK
          path: CalcoloRiduzioneTrafila.apk
